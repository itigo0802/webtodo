<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head :: head('登録')}"></head>
    <body>
        <header class="container-fluid">
            <nav>
                <ul>
                    <li><strong>TODOアプリ</strong></li>
                </ul>
            </nav>
        </header>
        <main class="container">
            <article>
                <h1>登録</h1>
                <hr />
                <form
                    th:object="${registerForm}"
                    th:action="@{/register}"
                    method="post"
                >
                    <div>
                        <label for="email">メールアドレス</label>
                        <input
                            type="email"
                            th:field="*{email}"
                            id="email"
                            placeholder="example@example.com"
                            required
                            autocomplete="email"
                            th:aria-invalid="${#fields.hasErrors('email')} ? 'true'"
                        />
                        <small
                            th:if="${#fields.hasErrors('email')}"
                            th:errors="*{email}"
                        ></small>
                    </div>
                    <div>
                        <label for="password">パスワード</label>
                        <input
                            type="password"
                            name="password"
                            id="password"
                            placeholder="XXXXXXXX"
                            minlength="8"
                            maxlength="72"
                            autocomplete="new-password"
                            required
                            th:aria-invalid="${#fields.hasErrors('password')} ? 'true'"
                        />
                        <small
                            th:if="${#fields.hasErrors('password')}"
                            th:errors="*{password}"
                        ></small>
                    </div>
                    <div>
                        <label for="name">ニックネーム</label>
                        <input
                            type="text"
                            th:field="*{name}"
                            id="name"
                            placeholder="ななし"
                            required
                            th:aria-invalid="${#fields.hasErrors('name')} ? 'true'"
                        />
                        <small
                            th:if="${#fields.hasErrors('name')}"
                            th:errors="*{name}"
                        ></small>
                    </div>
                    <button type="submit">登録</button>
                </form>
                <a th:href="@{/login}">ログイン</a>
            </article>
        </main>
    </body>
</html>

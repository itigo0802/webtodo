<tr th:fragment="todoItem(todo)">
    <td>
        <input
            type="checkbox"
            th:checked="${todo.done}"
            hx:post="@{/todos/{id}/toggle(id=${todo.id})}"
            hx-trigger="change"
            hx-target="closest tr"
            hx-swap="outerHTML"
            th:aria-label="${todo.done} ? |${todo.title}を未完了に戻す| : |${todo.title}を完了にする|"
        />
    </td>
    <td>
        <s th:if="${todo.done}" th:text="${todo.title}"></s>
        <span th:unless="${todo.done}" th:text="${todo.title}"></span>
    </td>
    <td
        th:text="${todo.dueDate}"
        th:classappend="${todo.isOverdue(today)} ? 'overdue'"
    ></td>
    <td>
        <a th:href="@{/todos/{id}/edit(id=${todo.id})}" role="button">編集</a>
        <form
            th:action="@{/todos/{id}/delete(id=${todo.id})}"
            method="post"
            hx:post="@{/todos/{id}/delete(id=${todo.id})}"
            hx-confirm="削除しますか?"
            hx-target="closest tr"
            hx-swap="outerHTML"
        >
            <button type="submit" class="secondary">削除</button>
        </form>
    </td>
</tr>

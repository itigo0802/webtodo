<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head :: head('TODO一覧')}"></head>
    <body th:replace="~{fragments/layout :: layout(~{::main})}">
        <main class="container">
            <h1>TODO一覧</h1>
            <article>
                <table>
                    <thead>
                        <tr>
                            <th>タイトル</th>
                            <th>期限日</th>
                            <th>完了</th>
                        </tr>
                    </thead>
                    <tbody th:unless="${#lists.isEmpty(todos)}">
                        <th:block th:each="todo : ${todos}">
                            <tr
                                th:replace="~{fragments/todoItem :: todoItem(${todo})}"
                            ></tr>
                        </th:block>
                    </tbody>
                    <tbody th:if="${#lists.isEmpty(todos)}">
                        <tr>
                            <td colspan="3">TODOがありません</td>
                        </tr>
                    </tbody>
                </table>
            </article>
        </main>
    </body>
</html>

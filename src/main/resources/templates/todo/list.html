<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/head :: head('TODO一覧')}"></head>
    <body>
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <main class="container">
            <h1>TODO一覧</h1>
            <article>
                <table>
                    <thead>
                        <tr>
                            <th>タイトル</th>
                            <th>期限日</th>
                            <th>完了</th>
                        </tr>
                    </thead>
                    <tbody th:unless="${#lists.isEmpty(todos)}">
                        <tr th:each="todo : ${todos}">
                            <td th:text="${todo.title}"></td>
                            <td th:text="${todo.dueDate}"></td>
                            <td>
                                <input
                                    type="checkbox"
                                    th:checked="${todo.done}"
                                    disabled
                                />
                            </td>
                        </tr>
                    </tbody>
                    <tbody th:if="${#lists.isEmpty(todos)}">
                        <tr>
                            <td colspan="3">TODOがありません</td>
                        </tr>
                    </tbody>
                </table>
            </article>
        </main>
    </body>
</html>

<!doctype html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
    <head
        th:replace="~{fragments/head :: head(${todoId} == null ? 'TODO追加' : 'TODO編集')}"
    ></head>
    <body th:replace="~{fragments/layout :: layout(~{::main})}">
        <main class="container">
            <h1 th:text="${todoId} == null ? 'TODO追加' : 'TODO編集'"></h1>
            <form
                th:action="${todoId} == null ? @{/todos/new} : @{/todos/{id}/edit(id=${todoId})}"
                th:object="${todoForm}"
                method="post"
            >
                <label for="title">タイトル</label>
                <input
                    type="text"
                    th:field="*{title}"
                    th:attr="aria-invalid=${#fields.hasErrors('title')}"
                />
                <small
                    th:if="${#fields.hasErrors('title')}"
                    th:errors="*{title}"
                ></small>

                <label for="dueDate">期限日</label>
                <input
                    type="date"
                    th:field="*{dueDate}"
                    th:attr="aria-invalid=${#fields.hasErrors('dueDate')}"
                />
                <small
                    th:if="${#fields.hasErrors('dueDate')}"
                    th:errors="*{dueDate}"
                ></small>

                <label for="description">説明</label>
                <textarea
                    th:field="*{description}"
                    th:attr="aria-invalid=${#fields.hasErrors('description')}"
                    rows="5"
                ></textarea>
                <small
                    th:if="${#fields.hasErrors('description')}"
                    th:errors="*{description}"
                ></small>
                <button
                    type="submit"
                    th:text="${todoId} == null ? '追加' : '更新'"
                ></button>
            </form>
        </main>
    </body>
</html>
